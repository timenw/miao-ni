name: Build MiaoNi APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Backup Flutter source
        run: |
          cp -r lib /tmp/miao_ni_lib
          cp pubspec.yaml /tmp/miao_ni_pubspec.yaml

      - name: Generate complete Flutter project skeleton
        run: flutter create --org com.timenw --project-name miao_ni .

      - name: Restore app source
        run: |
          rm -rf lib test analysis_options.yaml
          cp -r /tmp/miao_ni_lib lib
          cp /tmp/miao_ni_pubspec.yaml pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze app source only
        run: dart analyze lib/main.dart

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: miao-ni-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release asset for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/app/outputs/flutter-apk/app-debug.apk \
            --title "猫匿 ${GITHUB_REF_NAME}" \
            --notes "GitHub Actions built debug APK for 猫匿 CatNest."
